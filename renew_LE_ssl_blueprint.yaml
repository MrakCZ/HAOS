blueprint:
  name: Obnova Let's Encrypt Certifikátu
  description: Automatická obnova certifikátu a následné upozornění na konkrétní telefon.
  domain: automation
  input:
    cert_expiry_sensor:
      name: Kontrola platnosti certifikátu
      description: Vyberte senzor z integrace Certificate Expiry.
      selector:
        entity:
          filter:
            integration: cert_expiry
            domain: sensor
          multiple: false
    renew_date:
      name: Den obnovy
      description: Kolik dní před vypršením spustit obnovu.
      selector:
        number:
          min: 1
          max: 29
          mode: slider
          unit_of_measurement: "dní"
      default: 5
    time_to_check_cert:
      name: Čas kontroly
      description: V kolik hodin se má platnost kontrolovat.
      selector:
        time:
      default: "03:00:00"
    restart_after_renewal:
      name: Restartovat Home Assistant?
      description: Po obnově certifikátu restartuje aplikaci Home Assistant.
      selector:
        boolean:
      default: true
    minutes_till_restart:
      name: Prodleva před restartem
      description: Počet minut, aby měl addon čas certifikát bezpečně zapsat.
      selector:
        number:
          min: 1
          max: 60
          mode: slider
          unit_of_measurement: "min"
      default: 5
    send_notification:
      name: Zapnout notifikace
      selector:
        boolean:
      default: false
    notify_device:
      name: Zařízení pro notifikaci
      description: Vyberte telefon, na který má přijít upozornění.
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: false
    notification_title:
      name: Titulek notifikace
      default: "Obnova certifikátu"
    notification_message:
      name: Zpráva
      default: "Proces obnovy SSL certifikátu byl dokončen."

alias: Obnova SSL Cert
description: ''

variables:
  certificate_var: !input cert_expiry_sensor
  var_check: !input renew_date
  send_notification_var: !input send_notification
  restart_after_renewal_var: !input restart_after_renewal
  notification_title_var: !input notification_title
  notification_message_var: !input notification_message
  # Výpočet zbývajících dní
  expire_days_var: >-
    {% set expiry = states(certificate_var) %}
    {% if is_state(certificate_var, 'unavailable') or is_state(certificate_var, 'unknown') %}
      100
    {% else %}
      {{ ((as_timestamp(expiry, 0) - as_timestamp(now())) / 86400) | int }}
    {% endif %}

trigger:
  - platform: time
    at: !input time_to_check_cert

condition:
  - condition: template
    value_template: "{{ expire_days_var <= (var_check | int) }}"

action:
  # 1. Spuštění addonu
  - service: hassio.addon_start
    data:
      addon: core_letsencrypt

  # 2. Volitelná notifikace na vybrané zařízení
  - if:
      - condition: template
        value_template: "{{ send_notification_var }}"
    then:
      - domain: mobile_app
        type: notify
        device_id: !input notify_device
        title: "{{ notification_title_var }}"
        message: "{{ notification_message_var }}"

  # 3. Volitelný restart
  - if:
      - condition: template
        value_template: "{{ restart_after_renewal_var }}"
    then:
      - delay:
          minutes: !input minutes_till_restart
      - service: homeassistant.restart

mode: single
